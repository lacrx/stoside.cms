name: Deploy CMS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: strapi.cms
          push: true
          tags: |
            ghcr.io/lacrx/stoside.cms:latest
            ghcr.io/lacrx/stoside.cms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy Strapi CMS to EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd /opt/strapi/stoside.cms
            git -c credential.helper='!f() { echo "username=$GHCR_USER"; echo "password=$GHCR_TOKEN"; }; f' fetch origin main
            git checkout main 2>/dev/null || git checkout -b main origin/main
            git merge --ff-only origin/main
            cd strapi.cms
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env.production pull stoside-strapi
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate --remove-orphans
            docker logout ghcr.io
            docker image prune -f

            # Install daily SQLite backup cron (idempotent)
            BACKUP_CMD='0 6 * * * docker cp $(docker compose -f /opt/strapi/stoside.cms/strapi.cms/docker-compose.prod.yml ps -q stoside-strapi):/app/.tmp/data.db /tmp/stoside-backup.db && aws s3 cp /tmp/stoside-backup.db s3://stoside-media/cms-backups/stoside-$(date +\%F).db && find /tmp -name "stoside-backup.db" -delete'
            (crontab -l 2>/dev/null | grep -v "stoside-backup"; echo "$BACKUP_CMD") | crontab -

            echo "Waiting for Strapi to start..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:1337/api/articles > /dev/null 2>&1; then
                echo "Strapi is healthy after $i attempts"
                exit 0
              fi
              sleep 5
            done
            echo "Strapi did not become healthy in time"
            exit 1

  trigger-frontend:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend rebuild
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.FRONTEND_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lacrx/stoside.frontend/dispatches \
            -d '{"event_type":"cms-deploy","client_payload":{"sha":"${{ github.sha }}"}}'
          echo "Frontend rebuild triggered"
