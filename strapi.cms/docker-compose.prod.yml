# Production Docker Compose for Strapi CMS on EC2.
# Caddy reverse-proxies both stoside and ncyimby CMS instances via the
# shared cms-net Docker network.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - stoside-strapi
    networks:
      - cms-net

  stoside-strapi:
    image: ghcr.io/lacrx/stoside.cms:latest
    restart: unless-stopped
    env_file: .env.production
    ports:
      - '1337:1337'
    volumes:
      - strapi_data:/app/.tmp
    networks:
      - cms-net

volumes:
  strapi_data:
  caddy_data:
  caddy_config:

networks:
  cms-net:
    name: cms-net
